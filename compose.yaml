name: garden-center

services:
  ollama:
    image: ollama/ollama:0.40.18
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-garden_center}
      POSTGRES_USER: ${POSTGRES_USER:-garden_center}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garden_center}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - /bin/sh
      - -c
      - >-
        alembic upgrade head &&
        exec uvicorn garden_center.main:app --host 0.0.0.0 --port 8000
        --reload --reload-dir /app/src
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://garden_center:garden_center@db:5432/garden_center}
      DOCUMENT_STORAGE_PATH: /data/uploads
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-10485760}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-500}
      MAX_EXTRACTED_CHARACTERS: ${MAX_EXTRACTED_CHARACTERS:-2000000}
      CHUNK_SIZE_TOKENS: ${CHUNK_SIZE_TOKENS:-500}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-75}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-30}
      SEARCH_TOP_K: ${SEARCH_TOP_K:-5}
      SEARCH_SIMILARITY_THRESHOLD: ${SEARCH_SIMILARITY_THRESHOLD:-0.5}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./src:/app/src
      - document_uploads:/data/uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  document_uploads:
  ollama_models:
