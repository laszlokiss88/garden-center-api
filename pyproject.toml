[project]
name = "garden-center-api"
version = "0.1.0"
description = "Backend API for the Garden Center knowledge assistant."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic",
    "fastapi",
    "httpx",
    "langgraph",
    "openinference-instrumentation-langchain",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-sdk",
    "pgvector",
    "psycopg[binary]",
    "pymupdf",
    "pydantic-settings",
    "python-multipart",
    "sqlalchemy[asyncio]",
    "slowapi",
    "tiktoken",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garden_center"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires the Docker Compose database",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
